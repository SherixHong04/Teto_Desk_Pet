name: Publish release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and verify clean release archives
        shell: pwsh
        run: ./tools/Package.ps1
      - name: Publish ZIPs and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $expected = 'v' + (Get-Content dist/TetoDesk-*/release-manifest.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $expected) { throw 'Tag/version mismatch.' }
          gh release view $expected --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'This version is already published; existing release assets are retained.'; exit 0 }
          $files = @(Get-ChildItem dist -Filter '*.zip' | ForEach-Object FullName) + @('dist/SHA256SUMS.txt')
          gh release create $expected @files --target $env:GITHUB_SHA --title "Teto Desk $expected" --notes-file docs/RELEASE_NOTES.md
